<div class="seat-container">

  <h2>Seat Allocation</h2>

  <!-- Add Seat Form -->
  <div class="seat-form">

    <input
      placeholder="Table Name"
      [(ngModel)]="seatForm.tableName"
    />

    <input
      type="number"
      placeholder="Seats"
      [(ngModel)]="seatForm.seatNumber"
    />

    <input
      type="datetime-local"
      [(ngModel)]="seatForm.startTime"
      [min]="minDateTime"
      (change)="onStartTimeChange()"
    />

    <input
      type="datetime-local"
      [(ngModel)]="seatForm.endTime"
      [min]="seatForm.startTime"
    />

    <button (click)="addSeat()">
      Add Seat
    </button>

  </div>

<div class="seat-list" *ngIf="seats.length > 0">

  <h3>Created Seats</h3>

  <div class="seat-grid">

  <div class="seat-card" *ngFor="let seat of seats">

    <div class="seat-header">

      <div>
        <span class="label">Table</span>
        <strong>{{ seat.tableName }}</strong>
      </div>

      <div>
        <span class="label">Seat No</span>
        <strong>{{ seat.seatNumber }}</strong>
      </div>

    </div>

    <div class="seat-status">
      <span
        class="status"
        [class.available]="seat.available"
        [class.booked]="!seat.available"
      >
        {{ seat.available ? 'Available' : 'Booked' }}
      </span>
    </div>

    <div class="time-section">

      <h4>Time Slots</h4>

      <div
        class="time-slot"
        *ngFor="let s of seat.schedules"
      >
        <span>
          {{ s.startTime | date:'short' }}
        </span>

        <span class="arrow">→</span>

        <span>
          {{ s.endTime | date:'short' }}
        </span>
      </div>

    </div>

  </div>

</div>
