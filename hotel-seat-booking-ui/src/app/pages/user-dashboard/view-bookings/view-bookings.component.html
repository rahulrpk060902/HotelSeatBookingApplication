<div class="booking-container">

  <h2>My Bookings</h2>

  <!-- Loading -->
  <div *ngIf="loading" class="loading">
    Loading bookings...
  </div>

  <!-- No Bookings -->
  <div *ngIf="bookings.length === 0 && !loading" class="no-bookings">
    No bookings found.
  </div>

  <!-- Bookings Table -->
  <div
    class="booking-table-wrapper"
    *ngIf="bookings.length > 0 && !loading"
  >

    <table class="booking-table">

      <thead>
        <tr>
          <th>HOTEL NAME</th>
          <th>PLACE</th>
          <th>TABLE</th>
          <th>SEATS</th>
          <th>TIME SLOT</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let booking of bookings">

          <td class="hotel-name">
            {{ booking.hotelName }}
          </td>

          <td>
            {{ booking.hotelPlace }}
          </td>

          <td>
            {{ booking.tableName }}
          </td>

          <td>
            {{ booking.seatNumber }}
          </td>

          <td class="time-slot">

            <div>
              {{ booking.startTime | date:'short' }}
            </div>

            <span class="arrow">→</span>

            <div>
              {{ booking.endTime | date:'short' }}
            </div>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
