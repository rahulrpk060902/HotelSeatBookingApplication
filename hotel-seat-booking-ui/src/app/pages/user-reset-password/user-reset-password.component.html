<div class="main-container">

  <div class="left-section">

    <div class="login-card">

      <h2>Reset Password</h2>

      <p class="description">
        Enter the temporary password sent to your registered
        user email and create a new password.
      </p>

      <form
        [formGroup]="resetPasswordForm"
        (ngSubmit)="onSubmit()"
      >

        <!-- Temporary Password -->
        <div class="form-group">

          <label>Temporary Password</label>

          <input
            type="text"
            formControlName="temporaryPassword"
            placeholder="Enter temporary password"
          />

        </div>


        <!-- New Password -->
        <div class="form-group">

          <label>New Password</label>

          <input
            type="password"
            formControlName="newPassword"
            placeholder="Enter new password"
          />

        </div>


        <!-- Confirm Password -->
        <div class="form-group">

          <label>Confirm Password</label>

          <input
            type="password"
            formControlName="confirmPassword"
            placeholder="Confirm new password"
          />

        </div>


        <!-- Reset -->
        <button
          type="submit"
          [disabled]="resetPasswordForm.invalid || loading"
        >

          {{
            loading
              ? 'Resetting...'
              : 'Reset Password'
          }}

        </button>


        <!-- Error -->
        <p
          class="error"
          *ngIf="errorMessage"
        >
          {{ errorMessage }}
        </p>


        <!-- Success -->
        <p
          class="success"
          *ngIf="successMessage"
        >
          {{ successMessage }}
        </p>

      </form>


      <p class="back-login">

        <a routerLink="/user-login">
          ← Back to User Login
        </a>

      </p>

    </div>

  </div>

  <div class="right-section"></div>

</div>
