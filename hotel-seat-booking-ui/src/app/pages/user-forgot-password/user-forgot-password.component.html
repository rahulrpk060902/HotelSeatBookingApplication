<div class="main-container">

  <!-- LEFT SIDE -->
  <div class="left-section">

    <div class="login-card">

      <h2>Forgot Password</h2>

      <p class="description">
        Enter your registered user email address.
      </p>

      <form
        [formGroup]="forgotPasswordForm"
        (ngSubmit)="onSubmit()"
      >

        <!-- Email -->
        <div class="form-group">

          <label>Email</label>

          <input
            type="email"
            formControlName="email"
            placeholder="Enter your email"
          />

        </div>


        <!-- Button -->
        <button
          type="submit"
          [disabled]="forgotPasswordForm.invalid || loading"
        >

          {{ loading
            ? 'Sending...'
            : 'Send Temporary Password'
          }}

        </button>


        <!-- Error -->
        <p
          class="error"
          *ngIf="errorMessage"
        >
          {{ errorMessage }}
        </p>


        <!-- Success -->
        <p
          class="success"
          *ngIf="successMessage"
        >
          {{ successMessage }}
        </p>

      </form>


      <!-- Back -->
      <p class="back-login">

        <a routerLink="/user-login">
          ← Back to User Login
        </a>

      </p>

    </div>

  </div>


  <!-- RIGHT SIDE -->
  <div class="right-section"></div>

</div>
