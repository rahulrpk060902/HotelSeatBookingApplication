<div class="main-container">

  <!-- LEFT SIDE -->
  <div class="left-section">

    <div class="login-card">

      <h2>Reset Password</h2>

      <p class="description">
        Enter the temporary password sent to your registered
        hotel email and create a new password.
      </p>

      <form
        [formGroup]="resetPasswordForm"
        (ngSubmit)="onSubmit()"
      >


<!-- Temporary Password - ALWAYS VISIBLE -->
<div>
  <label>Temporary Password</label>

  <input
    type="text"
    formControlName="temporaryPassword"
    placeholder="Enter temporary password"
  />
</div>


<!-- New Password -->
<div>
  <label>New Password</label>

  <div class="password-wrapper">

    <input
      [type]="showNewPassword ? 'text' : 'password'"
      formControlName="newPassword"
      placeholder="Enter new password"
    />

    <button
      type="button"
      class="password-toggle"
      (click)="toggleNewPassword()"
    >
      {{ showNewPassword ? '👁️' : '👁️‍🗨️' }}
    </button>

  </div>
</div>


<!-- Confirm Password -->
<div>
  <label>Confirm Password</label>

  <div class="password-wrapper">

    <input
      [type]="showConfirmPassword ? 'text' : 'password'"
      formControlName="confirmPassword"
      placeholder="Confirm new password"
    />

    <button
      type="button"
      class="password-toggle"
      (click)="toggleConfirmPassword()"
    >
      {{ showConfirmPassword ? '👁️' : '👁️‍🗨️' }}
    </button>

  </div>
</div>


        <!-- Reset Button -->
        <button
          type="submit"
          [disabled]="resetPasswordForm.invalid || loading"
        >

          {{ loading
            ? 'Resetting...'
            : 'Reset Password'
          }}

        </button>


        <!-- Error -->
        <p
          class="error"
          *ngIf="errorMessage"
        >
          {{ errorMessage }}
        </p>


        <!-- Success -->
        <p
          class="success"
          *ngIf="successMessage"
        >
          {{ successMessage }}
        </p>

      </form>


      <!-- Back -->
      <p class="back-login">

        <a routerLink="/hotel-login">
          ← Back to Hotel Login
        </a>

      </p>

    </div>

  </div>


  <!-- RIGHT SIDE -->
  <div class="right-section"></div>

</div>
